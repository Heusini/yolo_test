# YOLO26 base with a two-stem (RGB + event) gated front end, nc=1. Load via a scale name through
# evrgb.config.load_dualstem_cfg("conf/yolo26n_evrgb_dualstem.yaml"); it scales the DualStemFuse/Index
# literals (written here in full-width units like every other line) for the chosen scale.

nc: 1
end2end: True
reg_max: 1
scales: # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, DualStemFuse, [13, 3, 256, 1.0, 2, 0.0, 0.0]] # 0: [c_in, c_rgb, c_out, evt_width, stem repeats, p_drop_rgb, p_drop_evt]
  - [-1, 1, Index, [256, 0]] # 1: fused map, P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 2
  - [-1, 1, Conv, [512, 3, 2]] # 3-P4/16
  - [-1, 2, C3k2, [512, True]] # 4
  - [-1, 1, Conv, [1024, 3, 2]] # 5-P5/32
  - [-1, 2, C3k2, [1024, True]] # 6
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 7
  - [-1, 2, C2PSA, [1024]] # 8

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 14 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 17 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 20 (P5/32-large)

  - [[14, 17, 20], 1, Detect, [nc]] # Detect(P3, P4, P5)
